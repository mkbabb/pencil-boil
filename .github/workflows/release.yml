# release — publish @mkbabb/pencil-boil to npm on a v*.*.* tag (G.W5 Sub-wave C).
#
# Re-runs the full package gate before npm publish. pencil-boil ships compiled
# JavaScript and declarations from the dist/ tree per package.json `files`.
#
# IDEMPOTENT BY DESIGN: the tag is the record of a release, and a tag may land after the
# version is already on the registry — a publish from the workstation, a re-pushed tag, a
# historical version tagged late. Publishing over a published version is a hard 403, so the
# job asks the registry first and skips when the version is already there. A red release run
# has to mean something went wrong; "this version already exists" is not that.
#
# Publish auth: NPM_TOKEN repository secret. Runs only on tag refs.
name: release

on:
    push:
        tags:
            - "v*.*.*"

jobs:
    publish:
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v4
            - uses: actions/setup-node@v4
              with:
                  node-version: "22.9.0"
                  registry-url: "https://registry.npmjs.org"
            - name: activate declared npm
              run: |
                  declared=$(node -p "require('./package.json').packageManager.replace(/^npm@/, '')")
                  npm install --global "npm@${declared}"
                  actual=$(npm --version)
                  if [ "$actual" != "$declared" ]; then
                      echo "npm $actual does not match declared npm@$declared"
                      exit 1
                  fi
            - run: npm ci
            - name: test (full package gate)
              run: npm test
            - name: tag matches package version
              run: |
                  tag="${GITHUB_REF_NAME}"
                  version=$(node -p "require('./package.json').version")
                  expected="v${version}"
                  if [ "$tag" != "$expected" ]; then
                      echo "tag $tag does not match package version $version (expected $expected)"
                      exit 1
                  fi
            - name: already on the registry?
              id: published
              run: |
                  version=$(node -p "require('./package.json').version")
                  if npm view "@mkbabb/pencil-boil@$version" version >/dev/null 2>&1; then
                      echo "exists=true" >> "$GITHUB_OUTPUT"
                      echo "@mkbabb/pencil-boil@$version is already published — skipping."
                  else
                      echo "exists=false" >> "$GITHUB_OUTPUT"
                  fi
            - name: publish
              if: steps.published.outputs.exists == 'false'
              run: npm publish --access public
              env:
                  NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
