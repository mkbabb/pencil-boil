# ci — PR + push gate for @mkbabb/pencil-boil (G.W5 Sub-wave C).
#
# pencil-boil publishes its TypeScript source directly (main/module/types
# all point at ./src/index.ts; files: ["src", ...]) — there is no build step.
# The gate is `npm test`: `check` (tsc --noEmit, the type-soundness contract for
# the published source) plus the runnable `proof` scripts (boil-guard scheduler
# invariants, useBoilFrames cache, celestial generators).
name: ci

on:
    pull_request:
        branches: [main, master]
    push:
        branches: [main, master]

jobs:
    gates:
        runs-on: ubuntu-latest
        timeout-minutes: 10
        steps:
            - uses: actions/checkout@v4
            - uses: actions/setup-node@v4
              with:
                  node-version: 24
                  cache: "npm"
            - run: npm ci
            - name: test (check + proofs)
              run: npm test
