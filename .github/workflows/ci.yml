# ci — PR + push gate for @mkbabb/pencil-boil (G.W5 Sub-wave C; browser lane added T4-W1).
#
# pencil-boil publishes compiled JavaScript and declarations from ./dist.
#
# Two gates:
#   gates         — `npm test`: check + all Node proofs + the real packed package-boundary
#                   verifier.
#   browser-proof — `npm run proof:browser`: builds the candidate, packs it, and serves the
#                   exact packed dist/raster.js artifact to Chromium and WebKit at DPR2.
name: ci

on:
    pull_request:
        branches: [main, master]
    push:
        branches: [main, master]

jobs:
    gates:
        runs-on: ubuntu-latest
        timeout-minutes: 10
        steps:
            - uses: actions/checkout@v4
            - uses: actions/setup-node@v4
              with:
                  node-version: "22.9.0"
                  cache: "npm"
            - name: activate declared npm
              run: |
                  declared=$(node -p "require('./package.json').packageManager.replace(/^npm@/, '')")
                  npm install --global "npm@${declared}"
                  actual=$(npm --version)
                  if [ "$actual" != "$declared" ]; then
                      echo "npm $actual does not match declared npm@$declared"
                      exit 1
                  fi
            - run: npm ci
            - name: test (check + proofs + package boundary)
              run: npm test

    browser-proof:
        runs-on: ubuntu-latest
        timeout-minutes: 20
        steps:
            - uses: actions/checkout@v4
            - uses: actions/setup-node@v4
              with:
                  node-version: "22.9.0"
                  cache: "npm"
            - name: activate declared npm
              run: |
                  declared=$(node -p "require('./package.json').packageManager.replace(/^npm@/, '')")
                  npm install --global "npm@${declared}"
                  actual=$(npm --version)
                  if [ "$actual" != "$declared" ]; then
                      echo "npm $actual does not match declared npm@$declared"
                      exit 1
                  fi
            - run: npm ci
            - name: install playwright browsers
              run: npx playwright install --with-deps chromium webkit
            - name: proof:browser (packed dist artifact — chromium + webkit, DPR2)
              run: npm run proof:browser
